name: High-quality source rebuild

on:
  push:
    branches: [codex/youtube-high-quality]

permissions:
  contents: read

env:
  PYTHONWARNINGS: ignore
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  EXPLAINER_RENDER_THREADS: '2'

jobs:
  frontier_training:
    name: Frontier training shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare computation environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config
          python3 -m pip install uv
          uv venv --python 3.12 --seed
          uv pip install --python .venv/bin/python torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python manim==0.19.0 numpy==2.2.6 scipy==1.16.3 numba==0.62.1
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Restore exact training corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          gh release download youtube-rebuild-cache-20261008 --repo "$GITHUB_REPOSITORY" --pattern frontier-training-seed.tar.gz --dir .cache
          tar -xzf .cache/frontier-training-seed.tar.gz
      - name: Reproduce assigned training experiments
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          .venv/bin/python -u - <<'PY'
          import os
          from videos.frontier import compute as c
          from explainer.lm.pocket import Config, PocketGPT, flops_per_token
          runs = {**c.iso_runs(), **c.opt_runs(), **c.sched_runs(), **c.stab_runs(), **c.moe_runs()}
          def cost(item):
              rd = item[1]
              cfg = Config(**rd['model'])
              return flops_per_token(PocketGPT(cfg).count(), cfg) * rd['tokens']
          ordered = sorted(runs.items(), key=cost, reverse=True)
          assigned = dict(ordered[int(os.environ['SHARD'])::4])
          print('Assigned experiments:', list(assigned), flush=True)
          c.run_all(assigned, workers=4)
          PY
      - name: Save experiment results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-runs-${{ matrix.shard }}
          path: .cache/frontier/runs/*.json
          retention-days: 1
          if-no-files-found: error
  render:
    name: Render ${{ matrix.video }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        video: [open_models, riemann, navier_stokes, llm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare native rendering tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config espeak-ng fonts-dejavu texlive-latex-extra texlive-science texlive-fonts-recommended dvisvgm tipa
          python3 -m pip install uv
          uv venv --python 3.12 --seed
          uv pip install --python .venv/bin/python torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python manim==0.19.0 kokoro==0.9.4 numpy==2.2.6 scipy==1.16.3 numba==0.62.1 transformers==4.57.6 huggingface-hub==0.36.2 mpmath==1.3.0 soundfile xlrd
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Restore completed source computations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          gh release download youtube-rebuild-cache-20261008 --repo "$GITHUB_REPOSITORY" --pattern rebuild-seed.tar.gz --dir .cache
          tar -xzf .cache/rebuild-seed.tar.gz
          rm .cache/rebuild-seed.tar.gz
      - name: Compute remaining source data
        run: |
          case '${{ matrix.video }}' in
            navier_stokes) .venv/bin/python -u -m videos.navier_stokes.simulate ;;
            riemann) .venv/bin/python -u -m videos.riemann.compute ;;
            llm) .venv/bin/python -u -m videos.llm.analyze ;;
          esac
      - name: Render native 1080p30 masters
        run: .venv/bin/python -u tools/build.py '${{ matrix.video }}' --crf 18 -j 2
      - name: Verify audio, captions, chapters, and decoding
        run: .venv/bin/python -u tools/youtube_qa.py '${{ matrix.video }}'
      - name: Save upload masters and verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: youtube-${{ matrix.video }}
          path: |
            renders/${{ matrix.video }}.mp4
            renders/${{ matrix.video }}.srt
            renders/${{ matrix.video }}.chapters.txt
            renders/youtube/${{ matrix.video }}.qa.json
            renders/youtube/${{ matrix.video }}-qa-*.jpg
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
