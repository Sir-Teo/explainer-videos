[project]
name = "explainer-videos"
version = "0.1.0"
description = "3Blue1Brown-style math & physics explainer videos built with Manim"
requires-python = ">=3.10,<3.13"
dependencies = [
    "manim>=0.19",
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "pillow>=10",
    # Narration (neural TTS).  Optional: set EXPLAINER_TTS=silent to skip.
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "transformers>=4.45",
    # Market data for videos/opposing_forces (Shiller's .xls); only fetch.py needs it.
    "xlrd>=2.0",
    # Zeta zeros, li(x), domain coloring for videos/riemann (compute.py).
    "mpmath>=1.3",
    # Common Crawl -> FineWeb filters, FineWeb-Edu shards for videos/frontier (compute.py only).
    "datatrove[processing]>=0.10",
    "warcio>=1.8",
    "faust-cchardet>=3.2",
    "python-magic>=0.4",
    "aiohttp>=3.9",
    "pyarrow>=15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["explainer*", "videos*"]
